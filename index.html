<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你是西游记里的谁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #f8f5f0;
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .home-box {
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            text-align: center;
        }
        .home-box h1 {
            font-size: 24px;
            color: #7b4b28;
            margin-bottom: 16px;
        }
        .home-box p {
            line-height: 1.7;
            color: #666;
            margin-bottom: 24px;
        }
        .start-btn {
            background-color: #9c6b43;
            color: white;
            border: none;
            padding: 14px 36px;
            border-radius: 99px;
            font-size: 16px;
            cursor: pointer;
        }
        .question-box {
            background: #fff;
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .q-index {
            color: #9c6b43;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .q-title {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .option-item {
            padding: 14px 16px;
            border: 1px solid #e2d8cc;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .option-item:hover {
            background-color: #f8f1e9;
        }
        .option-item.selected {
            background-color: #9c6b43;
            color: white;
            border-color: #9c6b43;
        }
        .btn-group {
            display: flex;
            gap:12px;
            margin-top:24px;
        }
        .prev-btn {
            flex:1;
            background: #eee;
            border:none;
            padding:12px;
            border-radius:99px;
            font-size:15px;
            cursor:pointer;
        }
        .next-btn {
            flex:1;
            background:#9c6b43;
            color:white;
            border:none;
            padding:12px;
            border-radius:99px;
            font-size:15px;
            cursor:pointer;
        }
        .result-box {
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .result-name {
            font-size:26px;
            color:#7b4b28;
            text-align:center;
            font-weight:bold;
            margin-bottom:16px;
        }
        .result-tag {
            text-align:center;
            color:#9c6b43;
            margin-bottom:20px;
        }
        .result-desc {
            line-height:1.7;
            margin-bottom:16px;
        }
        .restart-btn {
            width:100%;
            margin-top:24px;
            background:#9c6b43;
            color:white;
            border:none;
            padding:14px;
            border-radius:99px;
            font-size:16px;
            cursor:pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <!--首页-->
    <div class="page active" id="homePage">
        <div class="home-box">
            <h1>你是西游记里的谁</h1>
            <p>这套测试一共有40道题，根据你的选择，找到和你性格最贴合的西游角色。<br>答案没有好坏之分，只是看见属于你的特质。</p>
            <button class="start-btn" onclick="startTest()">开始测试</button>
        </div>
    </div>
    <!--答题页-->
    <div class="page" id="quizPage">
        <div class="question-box">
            <div class="q-index" id="qIndex"></div>
            <div class="q-title" id="qTitle"></div>
            <div id="optionWrap"></div>
            <div class="btn-group">
                <button class="prev-btn" id="prevBtn" onclick="prevQuestion()">上一题</button>
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一题</button>
            </div>
        </div>
    </div>
    <!--结果页-->
    <div class="page" id="resultPage">
        <div class="result-box">
            <div class="result-name" id="resName"></div>
            <div class="result-tag" id="resTag"></div>
            <div class="result-desc" id="resText"></div>
            <button class="restart-btn" onclick="restartTest()">重新测试</button>
        </div>
    </div>
</div>

<script>
// 四维：E/I 外向内向 | S/N 现实直觉 | T/F理性感性 | J/P计划随性
const questions = [

    {title:"长时间独处后你会？",opts:["想找人聊天(E)","觉得很舒服(I)"]},
    {title:"学习新东西，偏爱？",opts:["实操、看得见的成果(S)","概念、脑洞想象(N)"]},
    {title:"评价朋友，你更在意？",opts:["做事靠谱(T)","待人温柔(F)"]},
    {title:"临时改变计划，你会？",opts:["烦躁不适应(J)","觉得新鲜有趣(P)"]},
    {title:"情绪压抑时，你会？",opts:["找人倾诉(E)","自己消化(I)"]},
    {title:"听故事，你更容易记住？",opts:["细节经过(S)","寓意和氛围感(N)"]},
    {title:"争论一件事，你追求？",opts:["对错逻辑(T)","大家和睦(F)"]},
    {title:"桌面、日程一般？",opts:["整齐有序(J)","随性杂乱(P)"]},
    {title:"认识新朋友，你主动吗？",opts:["主动搭话(E)","等别人来找自己(I)"]},
    {title:"畅想未来，你更喜欢？",opts:["脚踏实地的目标(S)","很多可能性(N)"]},
    {title:"被误会，你会？",opts:["冷静解释道理(T)","委屈难过(F)"]},
    {title:"出去玩，你喜欢？",opts:["定好路线(J)","走到哪算哪(P)"]},
    {title:"灵感来了，你会？",opts:["马上分享给别人(E)","先记录给自己看(I)"]},
    {title:"选礼物，你看重？",opts:["实用耐用(S)","有心意氛围感(N)"]},
    {title:"团队分工，你更适合？",opts:["按规则执行(T)","照顾大家感受(F)"]},
    {title:"有多项任务，你习惯？",opts:["一件一件做完(J)","同时兼顾几件(P)"]},
    {title:"压力大的时候，你想要？",opts:["陪伴聊天(E)","安静独处(I)"]},
    {title:"看别人的经历，你更容易？",opts:["吸取经验(S)","联想到自己的故事(N)"]},
    {title:"别人犯错，你第一反应？",opts:["客观指出问题(T)","体谅对方难处(F)"]},
    {title:"答应别人的事，你？",opts:["一定做到(J)","看情况调整(P)"]},
    {title:"热闹场合，你是？",opts:["活跃气氛的人(E)","默默旁观的人(I)"]},
    {title:"做选择，你依赖？",opts:["过往经验(S)","内心预感(N)"]},
    {title:"赞美别人，你更擅长？",opts:["肯定能力(T)","肯定性格温柔(F)"]},
    {title:"假期结束，你通常？",opts:["提前收心(J)","很难缓过来(P)"]},
    {title:"想法很多，你会？",opts:["说出来讨论(E)","自己慢慢梳理(I)"]},
    {title:"遇到未知事物，你？",opts:["先看风险(S)","好奇想尝试(N)"]},
    {title:"和人产生分歧，你？",opts:["就事论事(T)","害怕关系变差(F)"]},
    {title:"重要事情，你？",opts:["提前准备(J)","临场发挥(P)"]},
    {title:"获得夸奖，你会？",opts:["开心和别人分享(E)","悄悄开心(I)"]},
    {title:"解决问题，你偏好？",opts:["成熟稳妥办法(S)","新奇思路(N)"]},
    {title:"看到别人难过，你？",opts:["理性分析办法(T)","跟着心疼(F)"]},
    {title:"生活节奏，你想要？",opts:["稳定可控(J)","自由不受限(P)"]},
];

// 24个西游角色结果，四维匹配
const resultMap = {
    "ESTJ":{name:"唐僧",tag:"执着渡人｜信念至上",text:"你心怀坚定的理想，有自己不容动摇的原则，愿意为目标长期坚持。待人有分寸，有责任感，有时会执着于自己认定的正道，容易忽略身边人的感受。"},
    "ESTP":{name:"孙悟空",tag:"果敢灵动｜不畏强权",text:"你行动力极强，反应快，敢闯敢拼，讨厌条条框框的束缚。聪明敏锐，擅长随机应变，有正义感，性子直率，容易冲动，不服管束。"},
    "ESFJ":{name:"观音菩萨",tag:"温柔慈悲｜共情守护",text:"你善于体察他人情绪，愿意包容、帮助身边的人，擅长维系关系。待人温和有耐心，习惯照顾别人，常常把他人需求放在前面。"},
    "ESFP":{name:"猪八戒",tag:"热爱生活｜及时行乐",text:"你喜欢轻松热闹，懂得享受当下，性格鲜活直白，不喜欢沉重压抑。心地不坏，容易心软，自制力偏弱，容易偷懒、贪图舒服。"},
    "ENTJ":{name:"如来佛祖",tag:"大局掌控｜运筹帷幄",text:"你格局开阔，擅长布局，目标感极强，擅长统筹规划。自带强大气场，做事果决，习惯站在全局思考，容易给人距离感。"},
    "ENTP":{name:"太白金星",tag:"巧思善辩｜灵活变通",text:"你脑洞多，擅长沟通斡旋，不喜欢死板的规则，乐于寻找新思路。口才好，善于周旋，想法跳脱，有时很难沉下心长期坚持一件事。"},
    "ENFJ":{name:"文殊菩萨",tag:"引路人｜心怀众生",text:"你擅长读懂别人，愿意引导、成全他人，自带感染力。有理想，重视价值，愿意去相信别人，也容易为了他人消耗自己。"},
    "ENFP":{name:"玉兔精",tag:"浪漫灵动｜热爱奇遇",text:"你想象力丰富，向往新鲜有趣的生活，内心柔软浪漫。讨厌枯燥重复，跟着热情走，容易三分钟热度，害怕被束缚。"},
    "ISTJ":{name:"沙和尚",tag:"踏实守诺｜安稳可靠",text:"你稳重内敛，责任心强，做事踏实靠谱，守规矩、重承诺。话不多，默默承担，不喜欢冒险，习惯做好分内的事，不太擅长表达情绪。"},
    "ISTP":{name:"二郎神",tag:"冷静自持｜实力内敛",text:"你冷静理性，动手能力强，遇事沉着，擅长独立解决难题。不爱多言，边界感强，不喜欢被说教，有自己的一套判断标准。"},
    "ISFJ":{name:"白龙马",tag:"默默付出｜温柔隐忍",text:"你内敛温柔，默默承担，忠诚度很高，习惯守护在意的人。不擅长主动索取，常常委屈自己，很少说出自己的需求。"},
    "ISFP":{name:"杏仙",tag:"诗意敏感｜随心自在",text:"你内心细腻敏感，偏爱美感，不喜争斗，向往自在松弛的状态。遵从内心感受，不爱争抢，害怕冲突，习惯避开压力。"},
    "INTJ":{name:"菩提祖师",tag:"通透深远｜独立悟道",text:"你擅长长远思考，洞察力强，喜欢独立钻研，目标清晰。自带疏离感，不喜欢无效社交，有自己的精神世界，很难被别人说服。"},
    "INTP":{name:"镇元大仙",tag:"随性思辨｜潜心自洽",text:"你喜欢思考本质，好奇心强，偏爱安静独处，享受思考的乐趣。对世俗纷争兴趣不大，节奏慢悠悠，不喜欢被催促。"},
    "INFJ":{name:"地藏王菩萨",tag:"悲悯内省｜看透人心",text:"你共情力很深，洞察力强，能感知别人藏起来的情绪。内心有坚定的信念，习惯向内思考，常常独自消化沉重情绪。"},
    "INFP":{name:"百花羞公主",tag:"温柔理想｜内心纯粹",text:"你内心有柔软的理想世界，敏感细腻，重视真诚。害怕冲突，容易内耗，常常在现实和内心理想之间拉扯。"},
    "ETJS":{name:"托塔李天王",tag:"守正持重｜规矩为先",text:"你重视秩序与责任，有担当，懂得权衡利弊，做事稳重。习惯按章法行事，不喜欢出格冒险，责任心强。"},
    "ETPS":{name:"红孩儿",tag:"热烈桀骜｜敢爱敢恨",text:"你生命力旺盛，情绪直白，敢冲敢闯，爱恨分明。不喜欢被压制，爆发力强，容易冲动，需要学会收敛锋芒。"},
    "EFJS":{name:"嫦娥",tag:"温柔自持｜体面从容",text:"你气质柔和，懂得照顾旁人感受，维持体面。待人友善，情绪克制，习惯保持距离，很少袒露脆弱一面。"},
    "EFPS":{name:"金角大王",tag:"随性快活｜自在随心",text:"你喜欢轻松自在，不爱紧绷，跟着心意行动，享受当下。心思简单，容易被诱惑，自控力偏弱。"},
    "NTJS":{name:"玉皇大帝",tag:"统筹全局｜隐忍权衡",text:"你擅长权衡各方，懂得隐忍布局，顾全大局。情绪不外露，习惯权衡利弊，不轻易表露真实想法。"},
    "NTPS":{name:"哪吒",tag:"反叛清醒｜自有本心",text:"你不盲从权威，有独立想法，敢打破固有规则，性格鲜明。爱恨分明，不愿被世俗定义，有倔强的底色。"},
    "NFJS":{name:"黎山老母",tag:"慈悲通透｜渡化人心",text:"你阅历感强，包容力强，善于点醒别人，温和有力量。善于看见他人难处，愿意包容，自带治愈感。"},
    "NFPS":{name:"琵琶精",tag:"热烈浪漫｜忠于自我",text:"你忠于自己的感受，热烈鲜活，不勉强迎合别人。内心浪漫，讨厌虚伪，敢表达自己想要的东西。"},
};

let current = 0;
let score = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
let selectedAnswers = [];

function startTest(){
    document.getElementById("homePage").classList.remove("active");
    document.getElementById("quizPage").classList.add("active");
    renderQuestion();
}
function renderQuestion(){
    const q = questions[current];
    document.getElementById("qIndex").innerText = `第 ${current+1} / ${questions.length} 题`;
    document.getElementById("qTitle").innerText = q.title;
    const wrap = document.getElementById("optionWrap");
    wrap.innerHTML = "";
    q.opts.forEach((opt,idx)=>{
        const div = document.createElement("div");
        div.className = "option-item";
        if(selectedAnswers[current] === idx) div.classList.add("selected");
        div.innerText = opt;
        div.onclick = ()=>{
            selectedAnswers[current] = idx;
            renderQuestion();
        }
        wrap.appendChild(div);
    })
    document.getElementById("prevBtn").style.visibility = current===0 ? "hidden":"visible";
}
function prevQuestion(){
    if(current>0){
        current--;
        renderQuestion();
    }
}
function nextQuestion(){
    if(selectedAnswers[current] === undefined){
        alert("请选择一个答案");
        return;
    }
    if(current < questions.length -1){
        current++;
        renderQuestion();
    }else{
        calcResult();
    }
}
function calcResult(){
    score = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
    for(let i=0;i<questions.length;i++){
        const ansIdx = selectedAnswers[i];
        const tag = questions[i].opts[ansIdx].match(/\((.+)\)/)[1];
        score[tag]++;
    }
    let e = score.E>score.I ? "E":"I";
    let s = score.S>score.N ? "S":"N";
    let t = score.T>score.F ? "T":"F";
    let j = score.J>score.P ? "J":"P";
    let key = e+t+s+j;
    if(!resultMap[key]) key = "INFP";
    const res = resultMap[key];
    document.getElementById("quizPage").classList.remove("active");
    document.getElementById("resultPage").classList.add("active");
    document.getElementById("resName").innerText = res.name;
    document.getElementById("resTag").innerText = res.tag;
    document.getElementById("resText").innerText = res.text;
}
function restartTest(){
    current=0;
    selectedAnswers=[];
    score = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
    document.getElementById("resultPage").classList.remove("active");
    document.getElementById("homePage").classList.add("active");
}
</script>
</body>
</html>
