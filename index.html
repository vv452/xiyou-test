const dimName = ["决断","共情","开创","洞察","表达","统筹","独立","担当"];

let current = 0;
let selectAns = Array(questions.length).fill(null);
let score = [0,0,0,0,0,0,0,0];
const storageKey = "xiyou_test_done";

function calcResult(){
  let bestIdx=0,bestVal=-999;
  for(let i=0;i<resultList.length;i++){
    let s=0;
    for(let d=0;d<8;d++) s += score[d] * (resultList[i].score[d]/100);
    if(s>bestVal){bestVal=s;bestIdx=i;}
  }
  return resultList[bestIdx];
}
function renderBar(arr){
  let html="";
  for(let i=0;i<8;i++){
    html += `<div class="bar-wrap"><div class="bar-line"><div class="bar-name">${dimName[i]}</div><div class="bar-bg"><div class="bar-fill" style="width:${arr[i]}%"></div></div><div class="bar-val">${arr[i]}</div></div></div>`;
  }
  return html;
}
function showResult(){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("resultPage").classList.add("active");
  const res = calcResult();
  document.getElementById("resPercent").innerText = res.pct + "%";
  document.getElementById("resName").innerText = res.name;
  document.getElementById("resTags").innerHTML = res.tags.map(t=>`<span class="tag">${t}</span>`).join("");
  document.getElementById("resVoice").innerText = "“"+res.voice+"”";
  document.getElementById("resSelf").innerText = res.self;
  document.getElementById("barBox").innerHTML = renderBar(res.score);
  document.getElementById("base1").innerText = res.b1;
  document.getElementById("base2").innerText = res.b2;
  document.getElementById("base3").innerText = res.b3;
  document.getElementById("resReal").innerText = res.real;
  document.getElementById("risk1").innerText = res.r1;
  document.getElementById("risk2").innerText = res.r2;
  document.getElementById("risk3").innerText = res.r3;
}
function renderQ(){
  const q = questions[current];
  document.getElementById("progress").innerText = `${current+1}/${questions.length}`;
  document.getElementById("qTitle").innerText = q.q;
  let optHtml = "";
  optHtml += `<div class="option ${selectAns[current]==='a'?'selected':''}" onclick="pick('a')">A. ${q.a}</div>`;
  optHtml += `<div class="option ${selectAns[current]==='b'?'selected':''}" onclick="pick('b')">B. ${q.b}</div>`;
  document.getElementById("optWrap").innerHTML = optHtml;
  document.getElementById("btnPrev").disabled = current===0;
}
function pick(v){
  selectAns[current] = v;
  renderQ();
}
function next(){
  if(selectAns[current]==null) return;
  if(current < questions.length-1){
    current++;renderQ();
  }else{
    score = [0,0,0,0,0,0,0,0];
    for(let i=0;i<questions.length;i++){
      const q = questions[i];
      const sel = selectAns[i];
      const w = sel==='a' ? q.w : q.w.map(x=>2-x);
      for(let d=0;d<8;d++) score[d] += w[d];
    }
    localStorage.setItem(storageKey,"1");
    showResult();
  }
}
function prev(){
  if(current>0){current--;renderQ();}
}
window.onload = function(){
  if(localStorage.getItem(storageKey)){
    showResult();
  }else{
    document.getElementById("coverPage").classList.add("active");
  }
  document.getElementById("btnStart").onclick = function(){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("quizPage").classList.add("active");
    renderQ();
  }
  document.getElementById("btnNext").onclick = next;
  document.getElementById("btnPrev").onclick = prev;
}
</script>
