<body>
    <div class="container">
        <div class="header">
            <span class="back-link">心理测试</span>
        </div>

        <div id="home">
            <div class="home-card">
                <div class="test-label">心理测试</div>

                <h1 class="title">你是西游记里的谁</h1>

                <p class="sub-title">
                    40题｜8维度人格测试<br />
                    测测你的性格最贴合西游哪一位角色
                </p>

                <div class="info-card">
                    <h3>测试介绍</h3>
                    <p>这是一个基于人格维度设计的趣味测试，通过你的选择判断性格倾向。</p>
                    <p>题目没有标准答案，按第一反应选择即可。</p>
                    <p class="tip">预计用时 5–8 分钟，仅供娱乐参考。</p>
                </div>

                <button class="start-btn" onclick="startTest()">开始测试</button>
            </div>
        </div>

        <div id="questionWrap" class="question">
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="q-title" id="qText"></div>
            <div id="optWrap"></div>
            <div class="btn-row">
                <button class="prev-btn" id="prevBtn" onclick="prevQ()">上一题</button>
                <button class="next-btn" onclick="nextQ()">下一题</button>
            </div>
        </div>

        <div id="resultWrap" class="result">
            <div class="result-label">测试结果</div>
            <div class="result-title" id="resTitle"></div>
            <div class="bar-wrap" id="barBox"></div>
            <div class="result-text" id="resContent"></div>
            <p class="tip">趣味测试，仅供娱乐参考✨</p>
        </div>
    </div>
