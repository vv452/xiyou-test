            { title: "🥁 黄眉老祖", content: "自信强势，有野心，相信自己的一套道理。敢挑战规则，格局不小，执着于证明自己。" },
            { title: "🐒 六耳猕猴", content: "洞察力拉满，共情力强，看透人心。心思复杂，渴望被认可，容易在自我认同里纠结。" },
            { title: "✨ 太乙真人", content: "洒脱随性，不拘小节，豁达乐观，偏爱因材施教。心态松弛，不刻板，愿意给别人成长的机会。" },
            { title: "🐉 潜龙白龙", content: "内敛自持，有远大志向，隐忍蓄力。平时低调，等到时机成熟，才会展露自己真正的力量。" }
        ];

        let score = 0;
        let cur = 0;
        let picked = -1;

        function startTest() {
            document.getElementById("home").style.display = "none";
            document.getElementById("questionWrap").style.display = "block";
            renderQ();
        }

        function renderQ() {
            const q = questions[cur];
            const progress = Math.round(((cur + 1) / questions.length) * 100);

            document.getElementById("progressBar").style.width = progress + "%";
            document.getElementById("qText").innerText = `${cur + 1}. ${q.q}`;

            let html = "";
            q.o.forEach((item, i) => {
                html += `<div class="option" onclick="pickOpt(${i},this)">${item}</div>`;
            });
            document.getElementById("optWrap").innerHTML = html;
        }

        function pickOpt(i, dom) {
            document.querySelectorAll(".option").forEach(el => el.classList.remove("active"));
            dom.classList.add("active");
            picked = i;
        }

        function nextQ() {
            if (picked === -1) {
                alert("请选一个答案哦");
                return;
            }

            score += questions[cur].d[picked];
            cur++;
            picked = -1;

            if (cur >= questions.length) {
                localStorage.setItem(keyName, "1");
                showResult();
                return;
            }

            renderQ();
        }

        function showResult() {
            document.getElementById("home").style.display = "none";
            document.getElementById("questionWrap").style.display = "none";
            document.getElementById("resultWrap").style.display = "block";

            let resIdx = Math.floor(score / 5);
            if (resIdx >= resultData.length) resIdx = resultData.length - 1;

            const res = resultData[resIdx];
            document.getElementById("resTitle").innerText = res.title;
            document.getElementById("resContent").innerText = res.content;

            document.getElementById("barBox").innerHTML = `
                <div class="bar-row"><span class="bar-label">决断力</span><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(score / 120 * 100, 100)}%"></div></div></div>
                <div class="bar-row"><span class="bar-label">共情力</span><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(score / 120 * 100, 100)}%"></div></div></div>
                <div class="bar-row"><span class="bar-label">开创力</span><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(score / 120 * 100, 100)}%"></div></div></div>
                <div class="bar-row"><span class="bar-label">洞察力</span><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(score / 120 * 100, 100)}%"></div></div></div>
            `;
        }
    </script>
</body>
</html>
