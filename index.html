<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你是西游记里的谁</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
        body{background:#fff8f0;color:#333;padding:20px;min-height:100vh}
        .container{max-width:620px;margin:0 auto;background:#fff;border-radius:24px;padding:26px;box-shadow:0 4px 18px #00000014}
        .cover-img{width:100%;border-radius:18px;margin-bottom:22px;object-fit:cover}
        .title{font-size:30px;font-weight:bold;text-align:center;margin-bottom:12px;color:#8b4513}
        .desc{text-align:center;color:#666;margin-bottom:30px;line-height:1.7;font-size:16px}
        .start-btn{width:100%;padding:17px;border:none;border-radius:999px;background:#8b4513;color:#fff;font-size:19px;font-weight:bold;cursor:pointer}
        .question{display:none}
        .q-title{font-size:19px;margin-bottom:22px;font-weight:500}
        .option{padding:15px;border:1px solid #f0e2d0;border-radius:15px;margin-bottom:13px;cursor:pointer;transition:0.22s}
        .option:hover{background:#fff3e4;border-color:#8b4513}
        .option.active{background:#f9e8d3;border-color:#8b4513}
        .next-btn{width:100%;padding:15px;margin-top:22px;border:none;border-radius:999px;background:#8b4513;color:#fff;font-size:17px;cursor:pointer}
        .result{display:none}
        .result-title{font-size:27px;font-weight:bold;color:#8b4513;text-align:center;margin-bottom:18px}
        .result-text{line-height:1.9;font-size:16px;margin-bottom:22px}
        .tip{margin-top:32px;color:#999;font-size:13px;text-align:center}
    </style>
</head>
<body>
    <div class="container">
        <div id="home">
            <!-- 这里换成备用方案：如果不想用外部图，直接去掉图片，或者用下面这个稳定图 -->
            <img class="cover-img" src="https://pic.616pic.com/ys_bnew_img/00/11/57/7lF1xUcY9k.jpg" alt="西游记封面">
            <h1 class="title">你是西游记里的谁</h1>
            <p class="desc">40题｜8维度人格测试<br>测测你的性格最贴合西游哪一位角色</p>
            <button class="start-btn" onclick="startTest()">开始测试</button>
        </div>

        <div id="questionWrap" class="question">
            <div class="q-title" id="qText"></div>
            <div id="optWrap"></div>
            <button class="next-btn" onclick="nextQ()">下一题</button>
        </div>

        <div id="resultWrap" class="result">
            <div class="result-title" id="resTitle"></div>
            <div class="result-text" id="resContent"></div>
            <p class="tip">趣味测试，仅供娱乐参考✨</p>
        </div>
    </div>

    <script>
        const keyName = "xiyou_test_done";
        if(localStorage.getItem(keyName)){
            showResult();
        }
        const questions = [
            {q:"遇到难题，你第一反应？",o:["迎难而上，想办法突破","先冷静观察，谋定后动","找人求助，一起商量","容易退缩，想要避开"]},
            {q:"别人误会你的时候，你会？",o:["立刻辩解，证明自己","懒得解释，时间会说明","温和沟通，慢慢说清","心里委屈，默默难过"]},
            {q:"团队里你更愿意？",o:["带头冲，负责攻坚","把控方向，稳住大局","做好分内，配合大家","活跃气氛，照顾所有人情绪"]},
            {q:"面对诱惑，你？",o:["意志坚定，不容易动摇","会犹豫，但最后守住底线","容易动心，需要别人提醒","很难抵抗，容易迷失"]},
            {q:"赶路的时候累了，你会？",o:["咬牙坚持，目标优先","合理休息，劳逸结合","不想走，想就地躺平","抱怨吐槽，需要人鼓励"]},
            {q:"朋友陷入麻烦，你？",o:["不顾一切出手帮忙","理性判断，量力而行","先安抚情绪再想办法","怕惹麻烦，选择远离"]},
            {q:"你看待规矩？",o:["守底线，但懂得变通","严格遵守，绝不越界","规矩是死的，人是活的","讨厌束缚，不想被约束"]},
            {q:"被批评之后，你？",o:["不服气，想证明自己","反思自己，改正不足","表面顺从，心里不服","容易自我否定、难过"]},
            {q:"一件事看不到回报，你还坚持吗？",o:["认准了就一直坚持","权衡利弊，及时止损","看大家要不要一起做","很难坚持，容易放弃"]},
            {q:"你的性格更偏向？",o:["直率热烈，爱恨分明","沉稳内敛，心思深远","温和包容，与世无争","机灵圆滑，懂得变通"]},
            {q:"做选择的时候，你？",o:["果断快速，不纠结","反复权衡，谨慎决定","听从身边人的建议","跟着感觉走"]},
            {q:"你相信天道轮回、善有善报吗？",o:["深信不疑，坚守本心","半信半疑，做好自己","不太在意现实得失","觉得世事不公"]},
            {q:"遇到强者打压，你？",o:["正面硬刚，绝不认输","寻找外援，借力解决","隐忍等待，伺机而动","妥协退让，保全自己"]},
            {q:"日常做事风格？",o:["雷厉风行，效率优先","稳扎稳打，步步为营","慢悠悠，不慌不忙","想到哪做到哪"]},
            {q:"你更看重？",o:["情义与初心","长远大局和结果","安稳自在的生活","利益和现实好处"],
            {q:"别人向你求助，你习惯？",o:["能帮就帮，热心仗义","评估能力再决定","怕麻烦，委婉拒绝","看人下菜碟"]},
            {q:"长期重复枯燥的任务，你？",o:["耐得住寂寞，持之以恒","可以坚持，但需要目标","很快觉得无聊乏味","完全没办法坚持"]},
            {q:"发现自己错了，你？",o:["知错就改，坦荡承认","嘴上不认输，悄悄改正","找理由掩饰自己","怪别人影响自己"]},
            {q:"新环境里，你？",o:["主动探索，快速适应","谨慎观察，慢慢融入","有点拘谨，需要陪伴","排斥陌生环境"]},
            {q:"理想中的生活是？",o:["一路历练，修成正果","大权在握，自在随心","平淡安稳，无灾无难","逍遥快活，不受管束"]},
            {q:"吵架的时候，你？",o:["直来直去，当场爆发","克制情绪，理性说理","委屈忍让，息事宁人","花言巧语哄过去"]},
            {q:"如果可以拥有一项能力，你选？",o:["强大战斗力，保护自己和伙伴","看透人心，预知祸福","慈悲治愈，化解苦难","来去自由，不受拘束"]},
            {q:"你容易心软吗？",o:["很容易心软，不忍心伤人","有原则，该强硬就强硬","只对亲近的人心软","不容易共情别人"]},
            {q:"计划被打乱，你？",o:["烦躁，想拉回正轨","灵活调整方案","顺其自然无所谓","直接摆烂不做了"]},
            {q:"和伙伴意见不合，你？",o:["坚持自己，据理力争","以大局为重，适当让步","迁就别人，委屈自己","巧言说服对方顺着你"]},
            {q:"你记仇吗？",o:["有仇当场报，过后放下","恩怨分明，长久铭记","不记仇，容易原谅别人","会默默记在心里"]},
            {q:"面对未知的危险，你？",o:["勇敢上前探路","谨慎小心，先探查","希望有人挡在前面","十分害怕，想要躲开"]},
            {q:"你学习新东西？",o:["悟性高，上手很快","踏实慢学，熟能生巧","需要有人带着教","提不起兴趣"]},
            {q:"名声对你来说？",o:["清誉很重要，不能败坏","实力比虚名重要","无所谓，舒服最重要","很在意别人评价"]},
            {q:"团队走散了，你会？",o:["拼尽全力寻找同伴","先自保，再想办法汇合","独自上路，另寻出路","干脆散伙各走各的"]},
            {q:"你会不会说谎？",o:["几乎不说谎，本性真诚","必要的时候善意说谎","为了自保会撒谎","很擅长圆滑话术"]},
            {q:"好事落到头上，你？",o:["保持本心，不骄不躁","欣然接受，把握机会","会担心是不是陷阱","理所当然收下"]},
            {q:"别人比你优秀，你？",o:["佩服，向对方学习","暗自较劲想超过他","有点嫉妒不舒服","无所谓，和我无关"]},
            {q:"你讨厌哪一类人？",o:["虚伪狡诈、搬弄是非","懦弱胆小、遇事逃避","狂妄自大、目中无人","死板固执、不懂变通"]},
            {q:"长途跋涉，你更在意？",o:["不忘初心，目标坚定","路上的风景和体验","能不能安稳休息","有没有好吃的"]},
            {q:"被人捧高夸奖，你？",o:["保持清醒，不飘","开心接受，有点骄傲","怀疑对方是不是客套","顺势享受赞美"]},
            {q:"你愿意为了大义牺牲自己吗？",o:["愿意，初心大于性命","看代价大小再决定","优先保全自己","绝对不愿意"]},
            {q:"生活里你更像？",o:["开拓者，闯难关的人","掌舵人，稳住方向的人","守护者，温柔包容的人","机灵鬼，灵活周旋的人"]},
            {q:"一件事没有立刻看到希望，你？",o:["默默坚持静待转机","评估后及时换方向","容易焦虑内耗","直接放弃"]},
            {q:"最后一题：你觉得人生重在？",o:["修行历练，守住本心","快意自在，随心所欲","安稳度日，平安喜乐","功成名就，得偿所愿"]}
        ]
        const resultData = [
            {title:"🐒 你是孙悟空",content:"你热烈勇敢、嫉恶如仇，有强大的能力和底气。敢对抗不公，有义气护着身边人。偶尔性子急躁，但初心很纯粹，一路跌撞历练，慢慢学会收敛锋芒，从桀骜不驯走向通透成熟。"},
            {title:"🙏 你是唐僧",content:"你内心坚定，信念感极强，认准目标就不会轻易动摇。心怀慈悲，愿意体谅他人，但是有时候容易心软分辨不清好坏。你有自己的道，哪怕前路艰难，也始终不会放弃心中的方向。"},
            {title:"🐷 你是猪八戒",content:"你热爱生活，懂得享受，性格鲜活接地气。重感情，内心柔软，偶尔偷懒、容易动摇，但关键时刻不会丢下同伴。比起宏大的理想，你更贪恋烟火温暖，是团队里的开心果。"},
            {title:"🪨 你是沙和尚",content:"你踏实稳重、任劳任怨，不抢风头，默默扛下琐事。情绪稳定，很少争执，忠诚靠谱，是团队的定心石。你不追求耀眼的高光，安于本分，稳稳托住所有人。"},
            {title:"🐎 你是白龙马",content:"你低调隐忍，默默付出，很少表达自己。有傲骨、有实力，甘愿藏起锋芒，默默陪着大家走完长路。不擅长表达，所有的付出都藏在沉默的坚持里。"},
            {title:"👑 你是如来",content:"你格局宏大，看透世事，情绪稳定，万事了然于心。很少动怒，包容万物，擅长顺势引导，不强行控制别人。内核强大，一切风波在你眼里都有定数。"},
            {title:"🧙 你是观音",content:"你温柔通透，心怀悲悯，善于点拨别人。懂得循循善诱，不会强硬说教，总能在别人困境的时候给出指引。慈悲又有分寸，是很好的倾听者和引路人。"},
            {title:"🐍 你是妖精",content:"你鲜活自我，不被世俗规矩束缚，想要的东西会主动争取。爱恨鲜明，敢爱敢恨，有自己的执念。你不是坏人，只是忠于自己的欲望，不甘平淡。"}
        ]
        let score = 0;
        let cur = 0;
        let selectAns = [];
        function startTest(){
            document.getElementById("home").style.display="none";
            document.getElementById("questionWrap").style.display="block";
            renderQ();
        }
        function renderQ(){
            const q = questions[cur];
            document.getElementById("qText").innerText = `${cur+1}. ${q.q}`;
            let html = "";
            q.o.forEach((item,i)=>{
                html += `<div class="option" onclick="pickOpt(${i},this)">${item}</div>`
            })
            document.getElementById("optWrap").innerHTML = html;
        }
        let picked = -1;
        function pickOpt(i,dom){
            document.querySelectorAll(".option").forEach(el=>el.classList.remove("active"));
            dom.classList.add("active");
            picked = i;
        }
        function nextQ(){
            if(picked === -1){alert("请选一个答案哦");return}
            selectAns.push(picked);
            score += picked;
            cur++;
            picked=-1;
            if(cur >= questions.length){
                localStorage.setItem(keyName,"1");
                showResult();
                return;
            }
            renderQ();
        }
        function showResult(){
            document.getElementById("home").style.display="none";
            document.getElementById("questionWrap").style.display="none";
            document.getElementById("resultWrap").style.display="block";
            let resIdx;
            if(score <= 25) resIdx=0;
            else if(score <=50) resIdx=1;
            else if(score <=75) resIdx=2;
            else if(score <=100) resIdx=3;
            else if(score <=120) resIdx=4;
            else if(score <=140) resIdx=5;
            else if(score <=160) resIdx=6;
            else resIdx=7;
            document.getElementById("resTitle").innerText = resultData[resIdx].title;
            document.getElementById("resContent").innerText = resultData[resIdx].content;
        }
    </script>
</body>
</html>
